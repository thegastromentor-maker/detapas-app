<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descargar Datos - De Tapas con Chencho</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 600px;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        h1 { color: #E74C3C; margin-bottom: 10px; text-align: center; font-size: 28px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; }
        .instructions { background: #f9f9f9; padding: 20px; border-radius: 6px; margin: 20px 0; border-left: 4px solid #E74C3C; }
        .instructions ol { margin-left: 20px; line-height: 1.8; }
        .instructions li { margin: 10px 0; }
        button {
            width: 100%;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #E74C3C;
            color: white;
            margin-top: 20px;
        }
        button:hover:not(:disabled) { background: #C0392B; transform: scale(1.02); }
        button:disabled { background: #ccc; cursor: not-allowed; transform: none; }
        .status { margin-top: 20px; padding: 15px; border-radius: 6px; text-align: center; display: none; font-weight: 500; }
        .status.loading { background: #e8f4f8; color: #0099cc; display: block; }
        .status.success { background: #e8f8f5; color: #27ae60; display: block; }
        .status.error { background: #fadbd8; color: #c0392b; display: block; }
        .stats { margin-top: 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .stat-box { background: #f9f9f9; padding: 20px; border-radius: 6px; text-align: center; }
        .stat-number { font-size: 32px; font-weight: bold; color: #E74C3C; }
        .stat-label { font-size: 12px; color: #666; margin-top: 8px; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍷 Descargar Datos</h1>
        <div class="subtitle">De Tapas con Chencho - 678 Restaurantes</div>

        <div class="instructions">
            <h3 style="margin-bottom: 12px;">📋 Instrucciones:</h3>
            <ol>
                <li>Haz clic en "📥 Descargar Datos"</li>
                <li>Espera a que se descargue <code>data.json</code></li>
                <li>Muévelo a esta carpeta</li>
                <li>Haz push a GitHub</li>
            </ol>
        </div>

        <button onclick="downloadData()">📥 Descargar Todos los 678 Restaurantes</button>

        <div id="status" class="status"></div>

        <div id="stats" class="stats" style="display: none;">
            <div class="stat-box">
                <div class="stat-number" id="totalCount">0</div>
                <div class="stat-label">Restaurantes</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="zonesCount">0</div>
                <div class="stat-label">Zonas</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="categoriesCount">0</div>
                <div class="stat-label">Categorías</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="featuresCount">0</div>
                <div class="stat-label">Características</div>
            </div>
        </div>
    </div>

    <script>
        function showStatus(message, type = 'loading') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = 'status ' + type;
        }

        async function downloadData() {
            const btn = event.target;
            btn.disabled = true;

            showStatus('⏳ Descargando datos desde detapasconchencho.es...');

            try {
                const response = await fetch('https://www.detapasconchencho.es/mapa/');
                const html = await response.text();

                const startIdx = html.indexOf('window.DTCC_MAP');
                if (startIdx === -1) throw new Error('No se encontró DTCC_MAP');

                showStatus('📊 Parseando datos...');

                const startJson = html.indexOf('{', startIdx);
                const endJson = html.indexOf('});', startJson) + 2;
                const jsonStr = html.substring(startJson, endJson);

                const mapData = JSON.parse(jsonStr);
                const restaurants = mapData.points || [];

                if (restaurants.length === 0) throw new Error('Sin restaurantes');

                const zones = new Set();
                const categories = new Set();
                const features = new Set();

                restaurants.forEach(r => {
                    if (r.zone) zones.add(r.zone);
                    if (Array.isArray(r.cuisines)) r.cuisines.forEach(c => categories.add(c));
                    if (Array.isArray(r.features)) r.features.forEach(f => features.add(f));
                });

                const finalData = {
                    points: restaurants,
                    total: restaurants.length,
                    zones: zones.size,
                    categories: categories.size,
                    features: features.size,
                    updated: new Date().toISOString()
                };

                document.getElementById('totalCount').textContent = finalData.total;
                document.getElementById('zonesCount').textContent = finalData.zones;
                document.getElementById('categoriesCount').textContent = finalData.categories;
                document.getElementById('featuresCount').textContent = finalData.features;
                document.getElementById('stats').style.display = 'grid';

                const dataStr = JSON.stringify(finalData, null, 2);
                const blob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'data.json';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                showStatus(`✅ ¡Descargado! ${finalData.total} restaurantes. Mueve el archivo a esta carpeta.`, 'success');

            } catch (error) {
                showStatus(`❌ Error: ${error.message}`, 'error');
                console.error(error);
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
